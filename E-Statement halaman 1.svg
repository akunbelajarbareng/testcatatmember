<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-weight: 800; fill: #0f172a; font-size: 20px; }
    .subtitle { font-weight: 500; fill: #64748b; font-size: 11px; letter-spacing: 0.5px; }
    .card-title { font-size: 9px; font-weight: 700; fill: #64748b; letter-spacing: 0.5px; }
    .card-val { font-size: 24px; font-weight: 800; fill: #0f172a; }
    .card-sub { font-size: 11px; font-weight: 600; fill: #dc2626; }
    .border-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 6px; }
    .th { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .td { font-size: 10px; fill: #1e293b; }
    .td-num { font-size: 10px; font-weight: 600; fill: #1e293b; text-anchor: end; }
    .td-void { font-size: 10px; font-weight: 700; fill: #dc2626; text-anchor: end; }
